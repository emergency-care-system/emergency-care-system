[package]
name = "tests-with-playwright-rust"
version = "0.1.0"
edition = "2021"
publish = false
description = "Playwright (playwright-rs) tests for the emergency care system demo app"
autotests = false

[dev-dependencies]
libtest-mimic = "0.8"
playwright-rs = "0.19"
regex = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

